<Directory /var/www/html/timezone.help/www>

	php_admin_flag engine on
	php_admin_flag safe_mode off
        php_flag display_errors on
        php_value error_reporting 2039
        php_value magic_quotes_gpc 0
        php_value register_globals 0
        php_value magic_quotes_runtime 0
        php_value register_long_arrays on

	Options -Includes -ExecCGI
	AllowOverride all
</Directory>

# lib_timezones' build scripts are command-line tools, and build/ holds nothing else
<Directory /var/www/html/timezone.help/www/lib_timezones/build>
	Require all denied
</Directory>

# Files lib_timezones' pages and scripts include, which aren't pages themselves. It's a
# submodule, so they're denied here rather than in a .htaccess in it.
<Directory /var/www/html/timezone.help/www/lib_timezones/data>
	<FilesMatch "^(dynamic|static)\.php$">
		Require all denied
	</FilesMatch>
</Directory>
<Directory /var/www/html/timezone.help/www/lib_timezones/lib>
	<Files "lib_timezones.php">
		Require all denied
	</Files>
</Directory>
<Directory /var/www/html/timezone.help/www/lib_timezones/test>
	<Files "testmore.php">
		Require all denied
	</Files>
</Directory>

<VirtualHost *:80>
	DocumentRoot /var/www/html/timezone.help/www

	ServerName timezone.help
	ServerAlias www.timezone.help

	Redirect permanent / https://timezone.help/
</VirtualHost>

Include /var/www/html/timezone.help/ssl.conf
